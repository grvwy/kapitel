<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>Kapitel — Your library. Your place.</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header id="header" hidden>
    <a class="brand" href="#library" aria-label="Kapitel home"><span class="brand-mark" aria-hidden="true">k.</span>kapitel</a>
    <nav aria-label="Main navigation"><a href="#library">Library</a><a href="#player" id="player-link" hidden>Listening</a><a href="#admin" id="admin-link" hidden>Manage</a></nav>
    <button id="sign-out" class="quiet" type="button">Sign out</button>
  </header>
  <main id="content" tabindex="-1"><p class="loading">Opening your library…</p></main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <section id="player-dock" class="player-dock" aria-label="Audio player" hidden>
    <a id="dock-book" href="#player"><span class="eyebrow">NOW PLAYING</span><strong id="dock-title"></strong><span id="dock-author" class="muted"></span></a>
    <div class="dock-controls"><button type="button" data-player="back" aria-label="Back 10 seconds">↶ 10</button><button type="button" data-player="toggle" class="primary play-button" aria-label="Play">Play</button><button type="button" data-player="forward" aria-label="Forward 10 seconds">10 ↷</button></div>
    <div class="dock-progress"><label for="dock-position" class="sr-only">Position in current part</label><input id="dock-position" type="range" min="0" max="1" step="0.1" value="0"><div class="time-row"><span id="dock-time">0:00</span><span id="sync-status" role="status" aria-live="polite">Ready</span></div></div>
  </section>
  <audio id="audio" preload="none"></audio>
</body>
</html>
