services:
  kapitel:
    build:
      context: .
      target: runtime
    image: kapitel:local
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAPITEL_PUBLIC_URL: ${KAPITEL_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - ${KAPITEL_LIBRARY_PATH:-./library}:/library:ro
      - kapitel-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    restart: unless-stopped

volumes:
  kapitel-data:
